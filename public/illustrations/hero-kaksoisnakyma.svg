<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-hidden="true">
  <!--
    Hero: kaksi puhelinta, keskella sama sopimus. Puhelimet ovat samankokoiset
    ja yhta kaukana keskiviivasta - se on koko kuvan viesti.

    Sivupuhelimet ovat TARKOITUKSELLA varittomia. Osapuoliväri (sky/coral)
    tulee taustapaneelista, joka vaihtaa puolta hero-kytkimen mukana. Jos vari
    olisi tassa SVG:ssa, se jaisi paikalleen kytkinta kaannettaessa ja
    osoittaisi vaaraan osapuoleen.

    Viivanpaksuus 5 = 2,5 yksikkoa 100 yksikon ruudukossa (viewBox 200).
  -->
  <g fill="none" stroke="#1B2A41" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="10" y="26" width="46" height="98" rx="9"/>
    <rect x="144" y="26" width="46" height="98" rx="9"/>
    <rect x="74" y="14" width="52" height="122" rx="5"/>
    <path d="M86 44h28M86 58h28M86 72h20"/>
    <path d="M86 104l8 8 14-16"/>
  </g>
  <g fill="#1B2A41" opacity="0.35">
    <rect x="20" y="40" width="26" height="6" rx="3"/>
    <rect x="20" y="54" width="18" height="6" rx="3"/>
    <rect x="154" y="40" width="26" height="6" rx="3"/>
    <rect x="154" y="54" width="18" height="6" rx="3"/>
    <circle cx="33" cy="104" r="9"/>
    <circle cx="167" cy="104" r="9"/>
  </g>
</svg>
